[package]
name = "remotex-updater"
version = "0.1.0"
edition = "2021"
description = "RemoteX self-updater — standalone helper that downloads, verifies, extracts and swaps the main app binary"
license = "MIT"

[[bin]]
name = "updater"
path = "src/main.rs"

[dependencies]
# HTTP client with streaming progress support
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# SHA-256 verification
sha2 = "0.10"
# zip extraction
zip = { version = "2", default-features = false, features = ["deflate"] }
# error handling
thiserror = "2"
# temp file / dir handling
tempfile = "3"

[profile.release]
lto = true
strip = true
