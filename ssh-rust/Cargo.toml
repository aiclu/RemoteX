[package]
name = "ssh-rust"
version = "0.1.0"
edition = "2021"
description = "RemoteX Rust SSH core (FFI cdylib) — russh-backed SSH terminal core"
license = "MIT"

[lib]
name = "ssh_rust"
crate-type = ["cdylib"]

[dependencies]
russh = "0.50.0"
russh-keys = "0.50.0-beta.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync", "net", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
once_cell = "1"
libc = "0.2"
thiserror = "2"
serialport = "4"
russh-sftp = "2.4.0"
suppaftp = { version = "10.0.1", features = ["native-tls", "deprecated"] }
native-tls = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# string encryption (1Remote.Security re-implementation)
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "std"] }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
pbkdf2 = "0.12"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"

[profile.release]
lto = true
