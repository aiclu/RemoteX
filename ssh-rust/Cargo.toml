[package]
name = "ssh-rust"
version = "0.1.0"
edition = "2021"
description = "1Remote Rust SSH core (FFI cdylib) — russh-backed SSH terminal core"
license = "MIT"

[lib]
name = "ssh_rust"
crate-type = ["cdylib"]

[dependencies]
russh = "0.50.0"
russh-keys = "0.50.0-beta.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
once_cell = "1"
libc = "0.2"
thiserror = "2"

[profile.release]
lto = true
